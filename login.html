<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Вход — PC Store</title>

    <link rel="stylesheet" href="css/style.css" />

    <link rel="stylesheet" href="css/auth.css" />
  </head>

  <body>
    <header class="header">
      <div class="container header__inner">
        <a href="index.html" class="logo"> PC<span>Store</span> </a>

        <nav class="nav">
          <a href="index.html"> Главная </a>

          <a href="catalog.html"> Каталог </a>

          <a href="cart.html"> Корзина </a>
        </nav>
      </div>
    </header>

    <main>
      <section class="auth">
        <div class="auth__container">
          <div class="auth__card">
            <h1>Вход</h1>

            <p class="auth__subtitle">Войдите в свой аккаунт</p>

            <form id="login-form">
              <div class="form-group">
                <label for="email"> Email </label>

                <input
                  type="email"
                  id="email"
                  placeholder="example@mail.com"
                  required
                />
              </div>

              <div class="form-group">
                <label for="password"> Пароль </label>

                <input
                  type="password"
                  id="password"
                  placeholder="Введите пароль"
                  required
                />
              </div>

              <button type="submit" class="btn btn-primary auth__button">
                Войти
              </button>

              <p id="login-message" class="auth__message"></p>
            </form>

            <div class="auth__footer">
              Нет аккаунта?

              <a href="register.html"> Зарегистрироваться </a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>© 2026 PC Store</p>
      </div>
    </footer>

    <script type="module" src="js/login.js"></script>
  </body>
</html>
