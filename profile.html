<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Личный кабинет — PC Store</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/profile.css" />
  </head>

  <body>
    <header class="header">
      <div class="container header__inner">
        <a href="index.html" class="logo"> PC<span>Store</span> </a>

        <nav class="nav">
          <a href="index.html"> Главная </a>

          <a href="catalog.html"> Каталог </a>

          <a href="cart.html"> Корзина </a>
        </nav>
      </div>
    </header>

    <main class="profile">
      <div class="container">
        <h1>Личный кабинет</h1>

        <!-- ПРОФИЛЬ -->

        <section class="profile-card">
          <h2>Мой профиль</h2>

          <form id="profile-form">
            <div class="profile-info">
              <div class="form-group">
                <label for="profile-name"> Имя </label>

                <input type="text" id="profile-name" required />
              </div>

              <div class="form-group">
                <label> Email </label>

                <input type="text" id="profile-email" disabled />
              </div>

              <div class="form-group">
                <label> Роль </label>

                <input type="text" id="profile-role" disabled />
              </div>

              <div class="form-group">
                <label> Статус </label>

                <input type="text" id="profile-status" disabled />
              </div>
            </div>

            <button type="submit" class="btn btn-primary">
              Сохранить изменения
            </button>

            <p id="profile-message"></p>
          </form>
        </section>

        <!-- ЗАКАЗЫ -->

        <section class="profile-card">
          <div class="profile-section-header">
            <div>
              <h2>История заказов</h2>

              <p>Ваши завершённые и текущие заказы</p>
            </div>
          </div>

          <div id="orders-container" class="orders">
            <p>Загрузка заказов...</p>
          </div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p>© 2026 PC Store</p>
      </div>
    </footer>

    <script type="module" src="js/profile.js"></script>
  </body>
</html>
